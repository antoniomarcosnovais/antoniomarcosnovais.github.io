<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projetos — Antônio Marcos Novais</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    background: #07111f;
    color: #fff;
    font-family: Arial, sans-serif;
}

body {
    overflow-x: hidden;
}

.projetos {
    min-height: 100vh;
    padding-bottom: 50px;
    position: relative;
    overflow: hidden;
}

.projetos::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    top: -250px;
    right: -150px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,0,.10), transparent 68%);
    animation: luz 9s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes luz {
    from { transform: translate(0,0); }
    to { transform: translate(-80px,100px); }
}

header {
    position: relative;
    z-index: 2;
    padding: 25px 6%;
    display: flex;
    justify-content: center;
}

nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 25px;
}

nav a {
    color: #ddd;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 1px;
    transition: .3s;
}

nav a:hover,
nav a.ativo {
    color: #ffd700;
}

.conteudo {
    position: relative;
    z-index: 2;
    max-width: 1050px;
    margin: 55px auto 0;
    padding: 0 30px;
}

.titulo {
    text-align: center;
}

.titulo h1 {
    margin: 0;
    color: #ffd700;
    font-size: 42px;
    letter-spacing: 2px;
}

.titulo p {
    margin-top: 12px;
    color: #aaa;
    font-size: 15px;
}

.projetos-grid {
    margin-top: 60px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.projeto {
    min-height: 180px;
    padding: 28px;
    background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    transition: .4s ease;
}

.projeto:hover {
    transform: translateY(-6px);
    border-color: rgba(255,215,0,.55);
    box-shadow:
        0 0 18px rgba(255,215,0,.10),
        0 12px 30px rgba(0,0,0,.35);
}

.projeto img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 18px;
}

.projeto h2 {
    margin: 0 0 12px;
    color: #ffd700;
    font-size: 21px;
}

.projeto p {
    margin: 0;
    color: #bbb;
    line-height: 1.6;
    font-size: 14px;
}

.voltar {
    display: block;
    width: fit-content;
    margin: 55px auto 0;
    padding: 11px 22px;
    border: 1px solid rgba(255,215,0,.5);
    border-radius: 7px;
    color: #ffd700;
    text-decoration: none;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    transition: .3s;
}

.voltar:hover {
    background: #ffd700;
    color: #07111f;
    box-shadow: 0 0 20px rgba(255,215,0,.35);
}

@media (max-width: 700px) {
    .projetos-grid {
        grid-template-columns: 1fr;
    }

    .titulo h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div class="projetos">

<header>
<nav>
    <a href="index.html">HOME</a>
    <a href="agenda.html">AGENDA</a>
    <a href="sermoes.html">REFLEXÕES</a>
    <a href="index-musicas-poesias.html">MÚSICAS</a>
    <a href="tecnologia.html" class="ativo">SIAVONSYSTEM</a>
    <a href="index.html">SOBRE MIM</a>
</nav>
</header>

<main>
  <img src="sys1.jpeg" alt="SIAVONSYSTEM" style="display:block;width:100%;height:auto;">
</main>

</div>

</body>
</html>
